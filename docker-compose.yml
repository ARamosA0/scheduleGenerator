services:
  algoritm-service:
    build:
      context: ./algoritm-service
    ports:
      - "8088:8088"
    volumes:
      - ./algoritm-service:/app
    command: cargo watch -x run
    networks:  # ← Añadir esta línea
      - backend-network  # ← Añadir esta línea

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/go/pkg/mod
    environment:
      - AIR_WORKSPACE_ROOT=/app
      - AIR_FULL_BUILD_ON_REBUILD=true
    command: air -c .air.toml
    env_file:
      - .env
    networks:  # ← Añadir esta línea
      - backend-network  # ← Añadir esta línea

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: npm run dev
    networks:  # ← Añadir esta línea
      - backend-network  # ← Añadir esta línea

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:  # ← Añadir esta línea
      - backend-network  # ← Añadir esta línea

volumes:
  postgres_data:

networks:
  backend-network:  # ← Corregir el nombre (estaba mal escrito)
    driver: bridge