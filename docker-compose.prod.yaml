services:
  algoritm-service:
    image: aldorama/schedule-algoritm
    container_name: algoritm-service
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    networks:
      - backend-network

  backend:
    image: aldorama/schedule-backend
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - algoritm-service
    networks:
      - backend-network

  frontend:
    image: aldorama/schedule-frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backend-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge